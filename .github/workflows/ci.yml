name: MAFHUM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required architecture documents exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md SECURITY.md .github/CODEOWNERS
            docs/PROJECT_ARCHITECTURE.md docs/ROADMAP.md docs/THREAT_MODEL.md
            docs/DATA_POLICY.md docs/OSS_REUSE_REGISTER.md
            docs/ADR/0001-modular-monolith.md
            THIRD_PARTY_NOTICES.md .gitignore .env.example
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: No obvious secrets in tracked config
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '(sk-[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .env.example; then
            echo "Possible secret found in .env.example"; exit 1
          fi

  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src
        env:
          MYPYPATH: src

      - name: Tests against real PostgreSQL
        # The suite starts its own PostgreSQL via pgserver and runs the real
        # Alembic migrations against it, so no service container is needed.
        #
        # Output is teed and the failure summary re-emitted as workflow
        # annotations. Run logs live on a blob host that is not reachable from
        # every environment, whereas annotations are served by the GitHub API, so
        # this is what makes a CI failure diagnosable rather than a bare
        # "exit code 1". The pytest exit code is preserved exactly.
        shell: bash
        run: |
          set +e
          pytest -p no:cacheprovider -rf 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest exited with code $code"
            echo "::error title=Environment::python $(python -V 2>&1); runner $(uname -sr)"
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "^(E  |_{5,}|>{5,})" /tmp/pytest.log | head -60 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"
        env:
          PYTHONPATH: src:.

      - name: Dependency audit
        run: pip-audit

  security:
    name: Security — SAST, secrets, config contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install verification tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "apps/api[dev]"

      # Bandit is a second, independent SAST implementation alongside ruff's
      # `S` rules in the backend job. -ll reports medium/high severity only, so
      # a low-confidence note cannot red-line an otherwise green commit.
      - name: Bandit SAST
        run: bandit -r apps/api/src -ll -q

      - name: Ruff security rules on repository tooling
        run: ruff check --config apps/api/pyproject.toml tools/security_baseline.py tools/acceptance/

      # Secret scan, workflow permission check, pinned dependencies, no :latest
      # images, .gitignore exclusions and the fail-closed Compose contract.
      - name: Repository security baseline
        run: python tools/security_baseline.py

      - name: Production Compose fail-closed contract
        run: python tools/acceptance/prod_compose_contract.py

      # Note: `pip-audit` is deliberately NOT run with --strict here. The local
      # editable `mafhum-api` package is not on PyPI, and --strict turns that
      # expected skip into a hard failure. The backend job runs plain pip-audit.

  backend-migrations:
    name: Migrations — upgrade and downgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mafhum
          POSTGRES_PASSWORD: mafhum
          POSTGRES_DB: mafhum_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mafhum"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Upgrade head, downgrade base, upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://mafhum:mafhum@localhost:5432/mafhum_migrations
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          echo "Migration round-trip succeeded."

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` needs a lockfile; fall back to a clean install if absent.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # Phase 6: the PptxGenJS comparison generator lives in its own package.
      # Its tests prove the benchmark deck can still be produced from the exact
      # same DeckSpec the Python generator consumes.
      - name: PPTX comparison generator tests
        working-directory: apps/slides
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: PPTX comparison generator audit
        # PptxGenJS 4.0.1 declares image-size ^1.2.1, which carries two high
        # DoS advisories. An override pins the patched 2.0.4; this gate fails if
        # that override is ever removed or a new advisory appears.
        working-directory: apps/slides
        run: npm audit

      - name: PPTX benchmark (both generators)
        # Node is present here, so the real comparison runs on the runner rather
        # than being reported from a workstation memory. The tool prints the
        # measured report and fails if either generator produces a non-editable
        # or direction-less deck.
        working-directory: .
        run: |
          python3 -m venv /tmp/mafhum-bench
          /tmp/mafhum-bench/bin/pip install --quiet python-pptx==1.0.2
          PYTHONPATH=apps/api/src /tmp/mafhum-bench/bin/python apps/api/tools/benchmark_pptx.py

      - name: PPTX visual pre-flight (structural, not a pixel render)
        # No LibreOffice/PowerPoint exists on the runner either. This gate
        # catches the defects that most often make an editable deck look wrong:
        # bidi control characters, missing RTL/complex-script tags, missing
        # chart/table parts, wrong slide size and impossible text-box sizes.
        working-directory: .
        run: |
          PYTHONPATH=apps/api/src /tmp/mafhum-bench/bin/python \
            apps/api/tools/check_pptx_visual.py \
            artifacts/pptx-benchmark/benchmark_python.pptx --rtl
          PYTHONPATH=apps/api/src /tmp/mafhum-bench/bin/python \
            apps/api/tools/check_pptx_visual.py \
            artifacts/pptx-benchmark/benchmark_pptxgenjs.pptx --rtl

      - name: Audit — production runtime
        run: npm audit --omit=dev

      - name: Audit — full tree (informational)
        # Dev-tree advisories are triaged in docs/THREAT_MODEL.md. This step is
        # allowed to fail without blocking, so a lint-time advisory with no
        # upstream fix cannot permanently red-line the build — but it is always
        # printed, never silently skipped.
        continue-on-error: true
        run: npm audit
