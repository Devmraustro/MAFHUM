name: Staging acceptance probes

# Runs the acceptance gates that cannot run in a restricted development sandbox:
# building and starting the real container image, and testing outbound TLS to the
# configured external sources. GitHub-hosted runners have a container runtime and
# general egress, which is exactly what these gates need -- so they are executed
# here rather than being left permanently BLOCKED on a workstation.
#
# This is dispatched manually rather than run on every push: it builds an image and
# makes real outbound connections, neither of which belongs in the fast PR loop.
#
# Honesty rule: a gate that cannot run reports BLOCKED and fails the job. Nothing
# here substitutes a mock for a real runtime or a real endpoint.

on:
  # workflow_dispatch is retained for future use, but GitHub only registers a
  # dispatchable workflow from the default branch -- which this work must not
  # modify. So the gates also run on push to the feature branch, where the file
  # actually lives.
  push:
    branches: [arena/1cb7b9d2-mafhum]
    paths:
      - ".github/workflows/staging-acceptance.yml"
      - "apps/api/Dockerfile"
      - "apps/api/.dockerignore"
      - "apps/api/entrypoint.sh"
      - "apps/api/src/mafhum_api/main.py"
      - "apps/api/pyproject.toml"
      - "tools/staging_verification.sh"
  workflow_dispatch:
    inputs:
      gates:
        description: "Gates to run (A, B, C, or ABC)"
        required: true
        default: "ABC"

permissions:
  contents: read

concurrency:
  group: staging-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-a-clamav-eicar:
    name: "Gate A: real ClamAV EICAR rejection"
    runs-on: ubuntu-latest
    if: contains(inputs.gates || 'ABC', 'A')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mafhum
          POSTGRES_PASSWORD: staging-only-not-a-secret
          POSTGRES_DB: mafhum_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mafhum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ClamAV and refresh real signatures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
          sudo freshclam
          dbdir=/var/lib/clamav
          core_db_count="$(find "$dbdir" -maxdepth 1 \( -name '*.cvd' -o -name '*.cld' \) -type f | wc -l)"
          test "$core_db_count" -gt 0
          newest="$(find "$dbdir" -maxdepth 1 \( -name '*.cvd' -o -name '*.cld' \) -type f -printf '%T@\n' | sort -nr | head -1)"
          test -n "$newest"
          test "$(( $(date +%s) - ${newest%.*} ))" -lt 604800
          echo "PASS: fresh ClamAV core signature database exists"

      - name: Start a real local ClamAV daemon and verify EICAR detection
        run: |
          set -euo pipefail
          sudo sed -i 's/^Example/#Example/' /etc/clamav/clamd.conf
          if grep -q '^#*TCPSocket ' /etc/clamav/clamd.conf; then
            sudo sed -i 's/^#*TCPSocket .*/TCPSocket 3310/' /etc/clamav/clamd.conf
          else
            echo 'TCPSocket 3310' | sudo tee -a /etc/clamav/clamd.conf >/dev/null
          fi
          if grep -q '^#*TCPAddr ' /etc/clamav/clamd.conf; then
            sudo sed -i 's/^#*TCPAddr .*/TCPAddr 127.0.0.1/' /etc/clamav/clamd.conf
          else
            echo 'TCPAddr 127.0.0.1' | sudo tee -a /etc/clamav/clamd.conf >/dev/null
          fi
          sudo systemctl start clamav-daemon
          for _ in $(seq 1 45); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/3310' 2>/dev/null; then break; fi
            sleep 1
          done
          timeout 2 bash -c '</dev/tcp/127.0.0.1/3310'
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          set +e
          verdict="$(clamdscan --no-summary /tmp/eicar.com 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$verdict"
          printf '%s' "$verdict" | grep -qi 'Eicar.*FOUND'
          test "$rc" -eq 1
          echo "PASS: real clamd detects EICAR"

      - name: Build API image and start fail-closed app against disposable services
        env:
          DATABASE_URL: postgresql+psycopg://mafhum:staging-only-not-a-secret@localhost:5432/mafhum_staging
          SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build -t mafhum-api:gate-a ./apps/api
          cid="$(docker run -d --network host
            -e APP_ENV=development
            -e DATABASE_URL="$DATABASE_URL"
            -e SESSION_SECRET="$SESSION_SECRET"
            -e STORAGE_ROOT=/tmp/mafhum-gate-a-store
            -e CLAMD_HOST=127.0.0.1
            -e CLAMD_PORT=3310
            -e MALWARE_SCAN_REQUIRED=true
            mafhum-api:gate-a)"
          echo "$cid" > /tmp/gate-a-cid
          ok=""
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then docker logs --tail 60 "$cid"; exit 1; fi
          echo "PASS: API is ready with malware scanning required"

      - name: Upload valid EICAR PDF through authenticated API and assert scanner rejection
        run: |
          set -euo pipefail
          cookiejar=/tmp/gate-a-cookies.txt
          curl -fsS -c "$cookiejar" -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"email":"gate-a-acceptance@example.test","password":"staging-test-password-123","display_name":"Gate A Acceptance"}' \
            http://127.0.0.1:8000/api/v1/auth/register >/tmp/gate-a-register.json
          csrf="$(awk '$6 == "mafhum_csrf" {print $7}' "$cookiejar")"
          test -n "$csrf"
          python3 apps/api/tools/eicar_probe.py /tmp/eicar-probe.pdf
          code="$(curl -sS -o /tmp/gate-a-response.json -w '%{http_code}' \
            -b "$cookiejar" -H 'Origin: http://localhost:3000' \
            -H "X-CSRF-Token: $csrf" \
            -F 'file=@/tmp/eicar-probe.pdf;type=application/pdf' \
            http://127.0.0.1:8000/api/v1/documents)"
          echo "upload HTTP status: $code"
          cat /tmp/gate-a-response.json
          test "$code" = "422"
          grep -q '"reason":"malware_detected"' /tmp/gate-a-response.json
          limits="$(curl -fsS http://127.0.0.1:8000/api/v1/documents/limits)"
          printf '%s' "$limits" | grep -q '"malware_scanning_available":true'
          echo "PASS: API rejected structurally valid EICAR PDF due to malware_detected and discloses scanner availability"

      - name: Stop acceptance API
        if: always()
        run: |
          if [ -f /tmp/gate-a-cid ]; then docker rm -f "$(cat /tmp/gate-a-cid)" >/dev/null 2>&1 || true; fi

  gate-b-container:
    name: "Gate B: container build and runtime"
    runs-on: ubuntu-latest
    if: contains(inputs.gates || 'ABC', 'B')
    services:
      # A disposable database that exists only for this job. It is not a
      # production instance and cannot reach one: it is a service container on the
      # runner's own network, torn down when the job ends.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mafhum
          POSTGRES_PASSWORD: staging-only-not-a-secret
          POSTGRES_DB: mafhum_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mafhum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Confirm a real container runtime exists
        run: |
          set -euo pipefail
          docker version --format 'client {{.Client.Version}} / server {{.Server.Version}}'
          docker info --format 'storage driver: {{.Driver}}'

      - name: Verify the build context excludes secrets and git metadata
        run: |
          set -euo pipefail
          test -f apps/api/.dockerignore
          grep -qx '\.env' apps/api/.dockerignore
          grep -qx '\.git' apps/api/.dockerignore
          echo "PASS: .dockerignore excludes .env and .git"

      - name: Build the image from the repository Dockerfile
        run: |
          set -euo pipefail
          docker build -t mafhum-api:acceptance ./apps/api 2>&1 | tee /tmp/build.log
          echo "PASS: image built"
          docker image inspect mafhum-api:acceptance --format 'image id {{.Id}}'

      - name: Verify the image runs as a non-root user
        run: |
          set -euo pipefail
          user="$(docker image inspect mafhum-api:acceptance --format '{{.Config.User}}')"
          echo "declared user: '${user}'"
          if [ -z "$user" ] || [ "$user" = "0" ]; then
            echo "FAIL: image would run as root"; exit 1
          fi
          echo "PASS: non-root user ${user}"

      - name: Verify the runtime uid and that the app starts and serves health
        env:
          DATABASE_URL: postgresql+psycopg://mafhum:staging-only-not-a-secret@localhost:5432/mafhum_staging
          SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A staging-only secret. It is a job-scoped token that expires when the
          # job ends and grants nothing outside this workflow; no project secret
          # and no production credential is used or printed.
          cid="$(docker run -d --network host \
            -e APP_ENV=development \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e STORAGE_ROOT=/tmp/mafhum-store \
            mafhum-api:acceptance)"
          echo "container ${cid:0:12}"
          echo "$cid" > /tmp/cid

          echo "runtime uid: $(docker exec "$cid" id -u)"
          test "$(docker exec "$cid" id -u)" != "0" || { echo "FAIL: running as root"; exit 1; }
          echo "PASS: process is not root"

          ok=""
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "FAIL: readiness never became healthy"; docker logs --tail 40 "$cid"; exit 1
          fi
          echo "PASS: readiness endpoint healthy"
          curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null
          echo "PASS: liveness endpoint responds"

      - name: Verify graceful shutdown by exit code, not by assumption
        run: |
          set -euo pipefail
          cid="$(cat /tmp/cid)"
          docker stop -t 20 "$cid" >/dev/null
          code="$(docker inspect "$cid" --format '{{.State.ExitCode}}')"
          oom="$(docker inspect "$cid" --format '{{.State.OOMKilled}}')"
          echo "exit code: $code  oom: $oom"
          [ "$oom" = "false" ] || { echo "FAIL: OOM killed"; exit 1; }
          [ "$code" = "0" ] || { echo "FAIL: exit $code, not graceful"; docker logs --tail 30 "$cid"; exit 1; }
          echo "PASS: graceful shutdown (exit 0)"
          docker rm -f "$cid" >/dev/null

  gate-c-external-tls:
    name: "Gate C: external TLS connectivity"
    runs-on: ubuntu-latest
    if: contains(inputs.gates || 'BC', 'C')
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and connect to the configured sources, layer by layer
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import socket, ssl, sys

          HOSTS = ["www.joradp.dz", "www.asjp.cerist.dz"]
          ok = 0
          for host in HOSTS:
              # Separate the layers so a network restriction is never mistaken for
              # an application defect.
              try:
                  infos = socket.getaddrinfo(host, 443, socket.AF_INET)
                  addrs = sorted({i[4][0] for i in infos})
              except OSError as exc:
                  print(f"{host}: DNS FAILED ({type(exc).__name__})")
                  continue
              print(f"{host}: DNS -> {addrs}")

              # A resolver can hand back a private address; note it rather than
              # silently connecting to something that is not the real host.
              private = [a for a in addrs if a.startswith(("10.", "192.168.", "172."))]
              if private:
                  print(f"  WARNING: resolver returned private-looking address(es) {private}")

              sock = socket.socket()
              sock.settimeout(15)
              try:
                  sock.connect((addrs[0], 443))
              except OSError as exc:
                  print(f"  TCP 443 FAILED ({type(exc).__name__})")
                  sock.close()
                  continue
              print("  TCP 443 connected")

              try:
                  # Certificate verification stays ON. No insecure context here.
                  ctx = ssl.create_default_context()
                  with ctx.wrap_socket(sock, server_hostname=host) as tls:
                      cert = tls.getpeercert()
                      print(f"  TLS OK {tls.version()} cipher={tls.cipher()[0]}")
                      print(f"  certificate subject={cert.get('subject')}")
                      ok += 1
              except ssl.SSLCertVerificationError as exc:
                  print(f"  TLS CERTIFICATE VALIDATION FAILED: {exc}")
              except Exception as exc:
                  print(f"  TLS HANDSHAKE FAILED ({type(exc).__name__}): {str(exc)[:120]}")
              finally:
                  sock.close()

          print(f"\n{ok}/{len(HOSTS)} hosts completed a verified TLS handshake")
          sys.exit(0 if ok else 1)
          PY
