# Prometheus scrape configuration for MAFHUM.
#
# This file is a TEMPLATE. It is not deployed by the production Compose stack and
# is not active until an operator starts deploy/docker-compose.monitoring.yml on
# the same host and supplies a real metrics token file.
#
# Scraping happens on the INTERNAL Docker network, directly against the api
# service. Metrics therefore never traverse the public internet and do not need
# TLS termination. The bearer token is still required: the endpoint is not
# public data even inside the private network.
#
# Prometheus does not expand environment variables in this file. Set the target
# to the Compose service name and put the token in the file mounted at
# /run/secrets/mafhum_metrics_token (see docs/MONITORING.md).

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: mafhum

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mafhum
    scheme: http
    metrics_path: /api/v1/admin/metrics
    bearer_token_file: /run/secrets/mafhum_metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # Prometheus' own health. `up{job="mafhum"} == 0` and `absent(...)` in the
  # alert rules are what detect a dead API; this job detects a dead monitor.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
