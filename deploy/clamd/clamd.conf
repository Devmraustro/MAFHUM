# clamd configuration for the MAFHUM production stack. TCP only: the packaged
# combination of LocalSocket + TCPSocket is known to break clamd's socket
# handling (Cisco-Talos/clamav#1326), which was observed in staging Gate A.
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground true
# A real file, NOT /dev/stdout: clamd opens its log with O_CREAT|O_APPEND and
# following the /dev/stdout -> /proc/self/fd/1 symlink chain fails with
# "Too many levels of symbolic links" (ELOOP), which kills the daemon at startup.
# deploy/clamd/entrypoint.sh tails this file to stderr so `docker logs` still
# shows everything.
LogFile /tmp/mafhum-clamd.log
LogTime yes
LogFileMaxSize 0

# Bounded resource use. StreamMaxLength must exceed the application's
# MAX_UPLOAD_MB (default 20) or clamd will refuse the INSTREAM transfer and the
# fail-closed policy would reject every legitimate large upload.
MaxThreads 8
MaxConnectionQueueLength 16
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 128M

# Never heal or delete an infected object. MAFHUM decides what to do with a
# verdict; the daemon only reports it.
DisableCache false
