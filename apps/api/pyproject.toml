[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mafhum-api"
version = "0.2.0"
description = "MAFHUM API — FastAPI + Pydantic v2 modular monolith"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.159.0",
  "starlette==1.9.0",
  "pydantic==2.11.1",
  "pydantic-settings==2.8.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.39",
  "alembic==1.20.0",
  "psycopg[binary,pool]==3.2.7",
  "bcrypt==4.3.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "mypy==1.15.0",
  "ruff==0.11.9",
  "pip-audit==2.10.1",
  "pgserver==0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*"]
ignore_missing_imports = true
